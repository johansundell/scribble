services:
  scribble-server:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    ports:
      # The container listens on 8080 (set in the Dockerfile); pick the host
      # port with HOST_PORT, e.g. HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # Named volume: Docker creates it owned like the image's /app/data, so
      # the non-root container user can write it on any host. A host folder
      # (./data) would usually belong to another uid and fail with
      # "permission denied".
      - data:/app/data
    environment:
      - USE_FILE_SYSTEM=false
      - STORAGE=sqlite
      - SQLITE_PATH=/app/data/scribble-server.db
      - DEBUG=false
    restart: unless-stopped

volumes:
  data:
