# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    # The Fyne GUI (cmd/scribble-gui) links against GL, X11 and Wayland.
    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Build
      run: go build -v ./...

    # The web app's phone checks (#65) drive the runner's Chrome through
    # its chromedriver.
    - name: Start chromedriver
      run: |
        "$CHROMEWEBDRIVER/chromedriver" --port=9515 &
        for i in $(seq 1 20); do curl -sf http://localhost:9515/status && exit 0; sleep 0.5; done
        exit 1

    - name: Test
      run: go test -v ./...
      env:
        SCRIBBLE_WEBDRIVER: http://localhost:9515
