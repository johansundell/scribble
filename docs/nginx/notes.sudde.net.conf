# Example nginx reverse proxy for scribble-server at notes.sudde.net.
#
# The server listens on 127.0.0.1:8082 (PORT=127.0.0.1:8082, or with Docker:
# HOST_PORT=127.0.0.1:8082). Binding to localhost keeps the plain-HTTP port off
# the network, so the bearer token only ever travels over TLS.
#
# Install: copy to /etc/nginx/sites-available/ (or conf.d/), get a certificate
# (for example `certbot certonly --webroot -w /var/www/certbot -d notes.sudde.net`),
# then `nginx -t && systemctl reload nginx`.

upstream scribble {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.sudde.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.sudde.net;

    ssl_certificate     /etc/letsencrypt/live/notes.sudde.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.sudde.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Note bodies may be up to 4 MB (handlers/notes.go); nginx's default is 1 MB.
    client_max_body_size 5m;

    # Note requests carry note text and the bearer token: don't log bodies or
    # headers here either.
    access_log /var/log/nginx/notes.sudde.net.access.log;
    error_log  /var/log/nginx/notes.sudde.net.error.log;

    location / {
        proxy_pass http://scribble;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A little above the server's own TIMEOUT (15 s by default).
        proxy_read_timeout 30s;
    }
}
